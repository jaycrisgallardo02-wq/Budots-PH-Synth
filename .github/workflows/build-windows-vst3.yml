name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: JUCE

      - name: Configure x64 VST3
        run: cmake -S . -B build -DJUCE_DIR=${{ github.workspace }}\JUCE -A x64

      - name: Build Release
        run: cmake --build build --config Release --target BudotsPHSynth_VST3

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Budots-PH-Synth-Windows-x64-VST3
          path: build/BudotsPHSynth_artefacts/Release/VST3/
          if-no-files-found: error
